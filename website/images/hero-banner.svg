<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gray gradient background matching reference -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8b2c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a95a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7580;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D metallic text gradient -->
    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d5e0;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#6ba5bf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d7a95;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#4d8aa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5568;stop-opacity:1" />
    </linearGradient>
    
    <!-- Flowing paint gradients -->
    <linearGradient id="flowPaint1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#2d8fb8;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:0.85" />
    </linearGradient>
    
    <linearGradient id="flowPaint2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b4c9a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8e6cc5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b88ce8;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="flowPaint3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4db8e8;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#2d8fb8;stop-opacity:0.85" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect -->
    <filter id="paintGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#heroBg)"/>
  
  <!-- Flowing paint effects - left side -->
  <g filter="url(#softShadow)" opacity="0.8">
    <path d="M 50 150 Q 100 120 170 130 Q 240 140 300 170 Q 340 190 360 220" 
          fill="url(#flowPaint1)" stroke="none"/>
    <path d="M 70 180 Q 130 155 200 165 Q 270 175 320 200" 
          fill="url(#flowPaint3)" stroke="none" opacity="0.7"/>
    <path d="M 90 210 Q 150 190 220 205 Q 280 215 330 240" 
          fill="url(#flowPaint1)" stroke="none" opacity="0.6"/>
  </g>
  
  <!-- Flowing paint effects - right side -->
  <g filter="url(#softShadow)" opacity="0.8">
    <path d="M 1560 380 Q 1620 365 1690 375 Q 1760 385 1820 410 Q 1860 430 1880 460" 
          fill="url(#flowPaint2)" stroke="none"/>
    <path d="M 1580 410 Q 1640 398 1710 408 Q 1780 418 1840 440" 
          fill="url(#flowPaint3)" stroke="none" opacity="0.7"/>
    <path d="M 1600 440 Q 1655 430 1725 440 Q 1790 448 1850 468" 
          fill="url(#flowPaint1)" stroke="none" opacity="0.6"/>
  </g>
  
  <!-- Paint orbs - decorative elements -->
  <g filter="url(#paintGlow)">
    <circle cx="200" cy="480" r="25" fill="#6b4c9a" opacity="0.7"/>
    <circle cx="200" cy="480" r="18" fill="#8e6cc5" opacity="0.5"/>
    <circle cx="195" cy="475" r="10" fill="#b88ce8" opacity="0.3"/>
    
    <circle cx="1700" cy="150" r="30" fill="#2d8fb8" opacity="0.7"/>
    <circle cx="1700" cy="150" r="22" fill="#4db8e8" opacity="0.5"/>
    <circle cx="1695" cy="145" r="12" fill="#00d4ff" opacity="0.3"/>
  </g>
  
  <!-- Main "Artemis" text with 3D metallic effect - centered -->
  <g transform="translate(960, 300)" filter="url(#deepShadow)">
    <!-- Text shadow for depth -->
    <text x="0" y="8" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="140" 
          font-weight="bold"
          font-style="italic"
          fill="#1a2832" 
          text-anchor="middle"
          letter-spacing="-3">Artemis</text>
    
    <!-- Main metallic text -->
    <text x="0" y="0" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="140" 
          font-weight="bold"
          font-style="italic"
          fill="url(#textMetallic)" 
          text-anchor="middle"
          letter-spacing="-3">Artemis</text>
    
    <!-- Highlight on text -->
    <text x="0" y="-4" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="140" 
          font-weight="bold"
          font-style="italic"
          fill="none"
          stroke="#d8eef5"
          stroke-width="1.2"
          text-anchor="middle"
          letter-spacing="-3"
          opacity="0.4">Artemis</text>
  </g>
  
  <!-- Purple/magenta dot accent on the "i" -->
  <g transform="translate(960, 300)" filter="url(#paintGlow)">
    <circle cx="26" cy="-65" r="14" fill="#6b4c9a"/>
    <circle cx="26" cy="-65" r="11" fill="#a86cd5" opacity="0.8"/>
    <circle cx="24" cy="-67" r="6" fill="#d8a8ff" opacity="0.6"/>
  </g>
  
  <!-- Subtitle -->
  <text x="960" y="380" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="36" 
        font-weight="400" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="10"
        opacity="0.95">DIGITAL PAINTING SOFTWARE</text>
  
  <!-- Additional flowing paint strokes for depth -->
  <g filter="url(#softShadow)" opacity="0.4">
    <path d="M 400 300 Q 500 285 600 295" 
          stroke="url(#flowPaint1)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M 1320 320 Q 1420 305 1520 315" 
          stroke="url(#flowPaint2)" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Particle effects -->
  <g opacity="0.5">
    <circle cx="300" cy="250" r="4" fill="#4db8e8"/>
    <circle cx="1600" cy="380" r="4" fill="#a86cd5"/>
    <circle cx="150" cy="350" r="3" fill="#00d4ff"/>
    <circle cx="1750" cy="250" r="3" fill="#6b4c9a"/>
    <circle cx="500" cy="450" r="3.5" fill="#2d8fb8"/>
    <circle cx="1400" cy="180" r="3.5" fill="#b88ce8"/>
  </g>
  
  <!-- Feature highlights at the bottom -->
  <g opacity="0.9">
    <text x="480" y="560" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#ffffff" 
          text-anchor="middle">178+ BRUSHES</text>
    
    <text x="768" y="560" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#ffffff" 
          text-anchor="middle">25+ AI FEATURES</text>
    
    <text x="1152" y="560" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#ffffff" 
          text-anchor="middle">NODE EDITOR</text>
    
    <text x="1440" y="560" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#ffffff" 
          text-anchor="middle">BROWSER-BASED</text>
  </g>
</svg>
