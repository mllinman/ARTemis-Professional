<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Brush stroke gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.6" />
      <stop offset="25%" style="stop-color:#ffd93d;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#6bcf7f;stop-opacity:0.6" />
      <stop offset="75%" style="stop-color:#4d96ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#bd93f9;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Radial gradient for spotlight -->
    <radialGradient id="spotlight">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#heroBg)"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="960" cy="300" rx="800" ry="400" fill="url(#spotlight)"/>
  
  <!-- Decorative geometric shapes -->
  <g opacity="0.1">
    <circle cx="200" cy="100" r="80" fill="url(#accentGrad)"/>
    <circle cx="1720" cy="500" r="100" fill="url(#accentGrad)"/>
    <rect x="100" y="400" width="120" height="120" fill="url(#accentGrad)" transform="rotate(45 160 460)"/>
    <rect x="1700" y="80" width="100" height="100" fill="url(#accentGrad)" transform="rotate(30 1750 130)"/>
  </g>
  
  <!-- Abstract paint strokes background -->
  <g opacity="0.3" filter="url(#glow)">
    <!-- Large sweeping strokes -->
    <path d="M 100 400 Q 300 350 500 380 T 900 400" 
          stroke="url(#strokeGrad)" 
          stroke-width="40" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.4"/>
    
    <path d="M 1000 250 Q 1200 200 1400 230 T 1800 280" 
          stroke="url(#strokeGrad)" 
          stroke-width="35" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.4"/>
    
    <path d="M 200 200 Q 400 150 600 180" 
          stroke="#667eea" 
          stroke-width="25" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.5"/>
    
    <path d="M 1300 450 Q 1500 420 1700 440" 
          stroke="#f093fb" 
          stroke-width="30" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.5"/>
    
    <!-- Smaller detail strokes -->
    <path d="M 300 500 Q 350 480 400 490" 
          stroke="#ffd93d" 
          stroke-width="15" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    
    <path d="M 1500 150 Q 1550 130 1600 145" 
          stroke="#6bcf7f" 
          stroke-width="18" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    
    <!-- Paint splatters -->
    <circle cx="800" cy="150" r="8" fill="#ff6b6b" opacity="0.6"/>
    <circle cx="820" cy="145" r="5" fill="#ffd93d" opacity="0.6"/>
    <circle cx="810" cy="160" r="6" fill="#4d96ff" opacity="0.6"/>
    
    <circle cx="1100" cy="480" r="10" fill="#6bcf7f" opacity="0.6"/>
    <circle cx="1120" cy="470" r="6" fill="#bd93f9" opacity="0.6"/>
    <circle cx="1090" cy="495" r="7" fill="#f093fb" opacity="0.6"/>
  </g>
  
  <!-- Main content area - large paintbrush -->
  <g transform="translate(1400, 300)" opacity="0.8" filter="url(#glow)">
    <!-- Brush handle -->
    <rect x="-30" y="-200" width="60" height="280" fill="#8b5a3c" rx="8">
      <animate attributeName="y" values="-200;-205;-200" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Wood grain -->
    <line x1="-20" y1="-190" x2="-20" y2="-80" stroke="#654321" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="-190" x2="0" y2="-80" stroke="#654321" stroke-width="3" opacity="0.3"/>
    <line x1="20" y1="-190" x2="20" y2="-80" stroke="#654321" stroke-width="3" opacity="0.3"/>
    
    <!-- Handle rings -->
    <ellipse cx="0" cy="-160" rx="32" ry="6" fill="#a0522d" opacity="0.6"/>
    <ellipse cx="0" cy="-120" rx="32" ry="6" fill="#a0522d" opacity="0.6"/>
    <ellipse cx="0" cy="-80" rx="32" ry="6" fill="#a0522d" opacity="0.6"/>
    
    <!-- Ferrule -->
    <path d="M -35 80 L -20 110 L 20 110 L 35 80 Z" fill="#e0e0e0"/>
    <path d="M -32 82 L -19 108 L -15 108 L -28 82 Z" fill="#ffffff" opacity="0.6"/>
    
    <!-- Bristles -->
    <path d="M -20 110 Q -25 135 -15 150 Q -8 156 0 159 Q 8 156 15 150 Q 25 135 20 110 Z" 
          fill="#ffffff" opacity="0.95">
      <animate attributeName="d" 
               values="M -20 110 Q -25 135 -15 150 Q -8 156 0 159 Q 8 156 15 150 Q 25 135 20 110 Z;
                       M -20 110 Q -26 137 -16 152 Q -8 158 0 161 Q 8 158 16 152 Q 26 137 20 110 Z;
                       M -20 110 Q -25 135 -15 150 Q -8 156 0 159 Q 8 156 15 150 Q 25 135 20 110 Z" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Paint stroke from brush -->
    <path d="M 0 150 Q 100 160 200 120 Q 280 90 350 80" 
          stroke="url(#strokeGrad)" 
          stroke-width="25" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9">
      <animate attributeName="d" 
               values="M 0 150 Q 100 160 200 120 Q 280 90 350 80;
                       M 0 150 Q 100 165 200 125 Q 280 95 350 85;
                       M 0 150 Q 100 160 200 120 Q 280 90 350 80" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Paint drips -->
    <ellipse cx="100" cy="155" rx="6" ry="10" fill="#ff6b6b" opacity="0.8">
      <animate attributeName="ry" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="125" rx="5" ry="8" fill="#ffd93d" opacity="0.8">
      <animate attributeName="ry" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Logo/Brand area (left side) -->
  <g transform="translate(250, 300)">
    <!-- Large 'A' letter -->
    <text x="0" y="0" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="180" 
          font-weight="bold" 
          fill="url(#accentGrad)" 
          stroke="#ffffff" 
          stroke-width="3"
          filter="url(#glow)"
          letter-spacing="-8">A</text>
    
    <!-- Paint splash on A -->
    <circle cx="50" cy="-40" r="8" fill="#ffd93d" opacity="0.8"/>
    <circle cx="60" cy="-35" r="5" fill="#ff6b6b" opacity="0.8"/>
    <circle cx="55" cy="-50" r="6" fill="#6bcf7f" opacity="0.8"/>
    
    <!-- Brand name -->
    <text x="150" y="-20" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="72" 
          font-weight="700" 
          fill="#ffffff" 
          letter-spacing="4">RTemis</text>
    
    <text x="150" y="30" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="400" 
          fill="#ffffff" 
          opacity="0.8"
          letter-spacing="6">PROFESSIONAL</text>
    
    <!-- Tagline -->
    <text x="0" y="100" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="32" 
          font-weight="300" 
          fill="#ffffff" 
          opacity="0.9">Digital Painting</text>
    
    <text x="0" y="140" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="32" 
          font-weight="300" 
          fill="#ffffff" 
          opacity="0.9">Redefined</text>
  </g>
  
  <!-- Feature highlights (bottom) -->
  <g transform="translate(100, 550)" opacity="0.7">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="500">
      <tspan x="0" y="0">✨ 178+ Professional Brushes</tspan>
      <tspan x="300" y="0">🎨 Natural Media Simulation</tspan>
      <tspan x="600" y="0">🤖 AI-Powered Tools</tspan>
      <tspan x="850" y="0">📚 Unlimited Layers</tspan>
      <tspan x="1100" y="0">🌐 Works in Browser</tspan>
      <tspan x="1350" y="0">💾 PSD Export</tspan>
    </text>
  </g>
</svg>
