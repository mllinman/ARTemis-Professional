<svg width="1920" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient - dark slate -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d30;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252526;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient - app colors -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e639c;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0e639c;stop-opacity:0.6" />
    </linearGradient>
    
    <!-- Brush stroke gradient - primary app colors -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0e639c;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0e639c;stop-opacity:0.5" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Radial gradient for spotlight -->
    <radialGradient id="spotlight">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#heroBg)"/>
  
  <!-- Spotlight effect -->
  <ellipse cx="960" cy="300" rx="800" ry="400" fill="url(#spotlight)"/>
  
  <!-- Decorative geometric shapes -->
  <g opacity="0.1">
    <circle cx="200" cy="100" r="80" fill="url(#accentGrad)"/>
    <circle cx="1720" cy="500" r="100" fill="url(#accentGrad)"/>
    <rect x="100" y="400" width="120" height="120" fill="url(#accentGrad)" transform="rotate(45 160 460)"/>
    <rect x="1700" y="80" width="100" height="100" fill="url(#accentGrad)" transform="rotate(30 1750 130)"/>
  </g>
  
  <!-- Abstract paint strokes background -->
  <g opacity="0.3" filter="url(#glow)">
    <!-- Large sweeping strokes -->
    <path d="M 100 400 Q 300 350 500 380 T 900 400" 
          stroke="url(#strokeGrad)" 
          stroke-width="40" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.4"/>
    
    <path d="M 1000 250 Q 1200 200 1400 230 T 1800 280" 
          stroke="url(#strokeGrad)" 
          stroke-width="35" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.4"/>
    
    <path d="M 200 200 Q 400 150 600 180" 
          stroke="#0e639c" 
          stroke-width="25" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.5"/>
    
    <path d="M 1300 450 Q 1500 420 1700 440" 
          stroke="#00d4ff" 
          stroke-width="30" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.5"/>
    
    <!-- Smaller detail strokes -->
    <path d="M 300 500 Q 350 480 400 490" 
          stroke="#00d4ff" 
          stroke-width="15" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    
    <path d="M 1500 150 Q 1550 130 1600 145" 
          stroke="#0e639c" 
          stroke-width="18" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.6"/>
    
    <!-- Paint splatters - app colors -->
    <circle cx="800" cy="150" r="8" fill="#0e639c" opacity="0.6"/>
    <circle cx="820" cy="145" r="5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="810" cy="160" r="6" fill="#0e639c" opacity="0.6"/>
    
    <circle cx="1100" cy="480" r="10" fill="#00d4ff" opacity="0.6"/>
    <circle cx="1120" cy="470" r="6" fill="#0e639c" opacity="0.6"/>
    <circle cx="1090" cy="495" r="7" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- Main content area - professional paintbrush -->
  <g transform="translate(1400, 300)" opacity="0.8" filter="url(#glow)">
    <!-- Brush handle - tapered -->
    <path d="M -32 -200 L -25 80 L 25 80 L 32 -200 Z" fill="#3a2818">
      <animate attributeName="transform" values="translate(0,0);translate(0,-5);translate(0,0)" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Wood grain -->
    <line x1="-22" y1="-190" x2="-20" y2="70" stroke="#1a0f08" stroke-width="2" opacity="0.4"/>
    <line x1="-8" y1="-195" x2="-6" y2="75" stroke="#1a0f08" stroke-width="2" opacity="0.4"/>
    <line x1="8" y1="-195" x2="6" y2="75" stroke="#1a0f08" stroke-width="2" opacity="0.4"/>
    <line x1="22" y1="-190" x2="20" y2="70" stroke="#1a0f08" stroke-width="2" opacity="0.4"/>
    
    <!-- Wood highlights -->
    <line x1="-26" y1="-180" x2="-24" y2="65" stroke="#5a4028" stroke-width="2" opacity="0.3"/>
    
    <!-- Handle bands -->
    <ellipse cx="0" cy="-150" rx="33" ry="5" fill="#2a1808" opacity="0.6"/>
    <ellipse cx="0" cy="-100" rx="32" ry="5" fill="#2a1808" opacity="0.6"/>
    <ellipse cx="0" cy="-50" rx="31" ry="5" fill="#2a1808" opacity="0.6"/>
    
    <!-- Ferrule - metallic -->
    <path d="M -26 80 L -18 108 L 18 108 L 26 80 Z" fill="#a0a0a0"/>
    <path d="M -24 82 L -17 106 L 17 106 L 24 82 Z" fill="none" stroke="#707070" stroke-width="1"/>
    <path d="M -22 84 L -16 104 L -12 104 L -18 84 Z" fill="#c0c0c0" opacity="0.6"/>
    
    <!-- Bristles - realistic -->
    <path d="M -18 108 Q -23 130 -13 147 Q -6 154 0 157 Q 6 154 13 147 Q 23 130 18 108 Z" 
          fill="#e8e8e8" opacity="0.95">
      <animate attributeName="d" 
               values="M -18 108 Q -23 130 -13 147 Q -6 154 0 157 Q 6 154 13 147 Q 23 130 18 108 Z;
                       M -18 108 Q -24 132 -14 149 Q -6 156 0 159 Q 6 156 14 149 Q 24 132 18 108 Z;
                       M -18 108 Q -23 130 -13 147 Q -6 154 0 157 Q 6 154 13 147 Q 23 130 18 108 Z" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Bristle strands -->
    <line x1="-12" y1="112" x2="-10" y2="145" stroke="#d0d0d0" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="110" x2="0" y2="155" stroke="#e0e0e0" stroke-width="1.5" opacity="0.7"/>
    <line x1="12" y1="112" x2="10" y2="145" stroke="#d0d0d0" stroke-width="1" opacity="0.6"/>
    
    <!-- Paint stroke from brush -->
    <path d="M 0 150 Q 100 160 200 120 Q 280 90 350 80" 
          stroke="url(#strokeGrad)" 
          stroke-width="25" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9">
      <animate attributeName="d" 
               values="M 0 150 Q 100 160 200 120 Q 280 90 350 80;
                       M 0 150 Q 100 165 200 125 Q 280 95 350 85;
                       M 0 150 Q 100 160 200 120 Q 280 90 350 80" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    
    <!-- Paint on brush tip -->
    <ellipse cx="0" cy="154" rx="6" ry="4" fill="#00d4ff" opacity="0.8"/>
    
    <!-- Paint drips -->
    <ellipse cx="100" cy="155" rx="6" ry="10" fill="#0e639c" opacity="0.85">
      <animate attributeName="ry" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="125" rx="5" ry="8" fill="#00d4ff" opacity="0.85">
      <animate attributeName="ry" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Logo/Brand area (left side) -->
  <g transform="translate(250, 300)">
    <!-- Large 'A' letter -->
    <text x="0" y="0" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="180" 
          font-weight="bold" 
          fill="url(#accentGrad)" 
          stroke="#cccccc" 
          stroke-width="3"
          filter="url(#glow)"
          letter-spacing="-8">A</text>
    
    <!-- Paint splash on A -->
    <circle cx="50" cy="-40" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle cx="60" cy="-35" r="5" fill="#0e639c" opacity="0.85"/>
    <circle cx="55" cy="-50" r="6" fill="#00d4ff" opacity="0.85"/>
    
    <!-- Brand name -->
    <text x="150" y="-20" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="72" 
          font-weight="700" 
          fill="#cccccc" 
          letter-spacing="4">RTemis</text>
    
    <text x="150" y="30" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="400" 
          fill="#858585" 
          letter-spacing="6">PROFESSIONAL</text>
    
    <!-- Tagline -->
    <text x="0" y="100" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="32" 
          font-weight="300" 
          fill="#cccccc" 
          opacity="0.95">Digital Painting</text>
    
    <text x="0" y="140" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="32" 
          font-weight="300" 
          fill="#cccccc" 
          opacity="0.95">Redefined</text>
  </g>
  
  <!-- Feature highlights (bottom) -->
  <g transform="translate(100, 550)" opacity="0.7">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="500">
      <tspan x="0" y="0">✨ 178+ Professional Brushes</tspan>
      <tspan x="300" y="0">🎨 Natural Media Simulation</tspan>
      <tspan x="600" y="0">🤖 AI-Powered Tools</tspan>
      <tspan x="850" y="0">📚 Unlimited Layers</tspan>
      <tspan x="1100" y="0">🌐 Works in Browser</tspan>
      <tspan x="1350" y="0">💾 PSD Export</tspan>
    </text>
  </g>
</svg>
