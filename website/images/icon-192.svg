<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8b2c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a95a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d5e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d7a95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paint192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d8fb8;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:0.85" />
    </linearGradient>
    <filter id="shadow192">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="192" height="192" fill="url(#bg192)" rx="36"/>
  
  <!-- Flowing paint accent -->
  <path d="M 30 50 Q 45 42 65 48 Q 80 53 85 65" fill="url(#paint192)" opacity="0.6"/>
  <path d="M 107 127 Q 125 123 145 130 Q 160 135 165 147" fill="#6b4c9a" opacity="0.6"/>
  
  <!-- Paint orbs -->
  <circle cx="150" cy="48" r="8" fill="#2d8fb8" opacity="0.6"/>
  <circle cx="150" cy="48" r="5" fill="#4db8e8" opacity="0.4"/>
  
  <!-- "Artemis" text -->
  <g filter="url(#shadow192)">
    <text x="96" y="110" 
          font-family="'Georgia', serif" 
          font-size="52" 
          font-weight="bold"
          font-style="italic"
          fill="url(#metal192)" 
          text-anchor="middle"
          letter-spacing="-1">Artemis</text>
  </g>
  
  <!-- Purple dot on i -->
  <circle cx="102" cy="77" r="5" fill="#6b4c9a"/>
  <circle cx="102" cy="77" r="3.5" fill="#a86cd5" opacity="0.7"/>
  
  <!-- Small particles -->
  <circle cx="45" cy="145" r="1.5" fill="#4db8e8" opacity="0.5"/>
  <circle cx="148" cy="68" r="1.5" fill="#a86cd5" opacity="0.5"/>
</svg>
