    <line x1="-12" y1="-140" x2="-12" y2="-60" stroke="#654321" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-140" x2="0" y2="-60" stroke="#654321" stroke-width="2" opacity="0.3"/>
    <line x1="12" y1="-140" x2="12" y2="-60" stroke="#654321" stroke-width="2" opacity="0.3"/>
    
    <ellipse cx="0" cy="-125" rx="22" ry="4" fill="#a0522d" opacity="0.6"/>
    <ellipse cx="0" cy="-100" rx="22" ry="4" fill="#a0522d" opacity="0.6"/>
    <ellipse cx="0" cy="-75" rx="22" ry="4" fill="#a0522d" opacity="0.6"/>
    
    <path d="M -25 50 L -15 75 L 15 75 L 25 50 Z" fill="url(#metal512)"/>
    <path d="M -23 52 L -14 73 L -11 73 L -20 52 Z" fill="#ffffff" opacity="0.6"/>
    
    <g>
      <path d="M -15 75 Q -20 105 -12 120 Q -6 125 0 128 Q 6 125 12 120 Q 20 105 15 75 Z" 
            fill="#ffffff" opacity="0.95"/>
      <path d="M -10 75 Q -12 102 -7 115 Q -2.5 120 0 122 Q 2.5 120 7 115 Q 12 102 10 75 Z" 
