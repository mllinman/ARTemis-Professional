    <circle cx="-60" cy="-75" r="5" fill="#ffd93d" opacity="0.8"/>
    <circle cx="-55" cy="-68" r="2.5" fill="#ff6b6b" opacity="0.8"/>
    <circle cx="-50" cy="-81" r="3.5" fill="#6bcf7f" opacity="0.8"/>
  </g>
  
  <text x="256" y="435" 
