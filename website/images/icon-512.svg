<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d30;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#252526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brush512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3728;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a2818;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1808;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a9a9a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a8a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paint512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e639c;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0e639c;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow512" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#bg512)" rx="96"/>
  <rect width="512" height="512" fill="none" stroke="#0e639c" stroke-width="6" opacity="0.4" rx="96"/>
  
  <g opacity="0.15">
    <path d="M 100 140 Q 200 120 300 150" stroke="url(#paint512)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 380 180 Q 420 220 400 280" stroke="url(#paint512)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 120 380 Q 180 410 240 390" stroke="url(#paint512)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(256, 256)" filter="url(#shadow512)">
