        font-size="54" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="3">ARTemis</text>
  
  <text x="256" y="470" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="400" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.9"
        letter-spacing="4">PROFESSIONAL</text>
</svg>
