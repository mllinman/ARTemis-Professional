<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8b2c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a95a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textMetal512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d5e0;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#6ba5bf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d7a95;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#4d8aa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flowPaint512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2d8fb8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="flowPaint2_512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b4c9a;stop-opacity:0.75" />
      <stop offset="50%" style="stop-color:#8e6cc5;stop-opacity:0.75" />
      <stop offset="100%" style="stop-color:#b88ce8;stop-opacity:0.75" />
    </linearGradient>
    <filter id="deepShadow512" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="5" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paintGlow512">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow512">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="3" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#bg512)" rx="96"/>
  
  <!-- Flowing paint effects -->
  <g filter="url(#softShadow512)" opacity="0.75">
    <path d="M 80 130 Q 130 105 200 120 Q 270 135 320 170 Q 360 195 380 230" 
          fill="url(#flowPaint512)" stroke="none"/>
    <path d="M 100 165 Q 160 145 230 160 Q 300 175 350 200" 
          fill="url(#flowPaint512)" stroke="none" opacity="0.7"/>
  </g>
  
  <g filter="url(#softShadow512)" opacity="0.75">
    <path d="M 280 340 Q 340 325 400 340 Q 460 355 485 385" 
          fill="url(#flowPaint2_512)" stroke="none"/>
    <path d="M 300 370 Q 360 358 420 373 Q 470 385 490 410" 
          fill="url(#flowPaint512)" stroke="none" opacity="0.7"/>
  </g>
  
  <!-- Paint orbs -->
  <g filter="url(#paintGlow512)">
    <circle cx="140" cy="420" r="28" fill="#6b4c9a" opacity="0.7"/>
    <circle cx="140" cy="420" r="20" fill="#8e6cc5" opacity="0.5"/>
    
    <circle cx="405" cy="120" r="35" fill="#2d8fb8" opacity="0.7"/>
    <circle cx="405" cy="120" r="25" fill="#4db8e8" opacity="0.5"/>
  </g>
  
  <!-- "Artemis" text with 3D metallic effect -->
  <g transform="translate(256, 300)" filter="url(#deepShadow512)">
    <text x="0" y="10" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="130" 
          font-weight="bold"
          font-style="italic"
          fill="#1a2832" 
          text-anchor="middle"
          letter-spacing="-2">Artemis</text>
    
    <text x="0" y="0" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="130" 
          font-weight="bold"
          font-style="italic"
          fill="url(#textMetal512)" 
          text-anchor="middle"
          letter-spacing="-2">Artemis</text>
    
    <text x="0" y="-4" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="130" 
          font-weight="bold"
          font-style="italic"
          fill="none"
          stroke="#d8eef5"
          stroke-width="1.5"
          text-anchor="middle"
          letter-spacing="-2"
          opacity="0.4">Artemis</text>
  </g>
  
  <!-- Purple dot on i -->
  <g transform="translate(256, 300)" filter="url(#paintGlow512)">
    <circle cx="24" cy="-66" r="13" fill="#6b4c9a"/>
    <circle cx="24" cy="-66" r="10" fill="#a86cd5" opacity="0.8"/>
    <circle cx="22" cy="-68" r="6" fill="#d8a8ff" opacity="0.6"/>
  </g>
  
  <!-- Particles -->
  <g opacity="0.5">
    <circle cx="190" cy="200" r="4" fill="#4db8e8"/>
    <circle cx="370" cy="350" r="4" fill="#a86cd5"/>
    <circle cx="110" cy="290" r="3.5" fill="#00d4ff"/>
    <circle cx="430" cy="220" r="3.5" fill="#6b4c9a"/>
  </g>
  
  <g transform="translate(256, 256)" filter="url(#shadow512)">
    <text x="-120" y="-50" 
          font-family="'Helvetica Neue', Arial, sans-serif" 
          font-size="150" 
          font-weight="bold" 
          fill="#ffffff" 
          stroke="#764ba2" 
          stroke-width="3"
          letter-spacing="-6">A</text>
    
    <circle cx="-60" cy="-75" r="5" fill="#ffd93d" opacity="0.8"/>
    <circle cx="-55" cy="-68" r="2.5" fill="#ff6b6b" opacity="0.8"/>
    <circle cx="-50" cy="-81" r="3.5" fill="#6bcf7f" opacity="0.8"/>
  </g>
  
  <text x="256" y="435" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="54" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="3">ARTemis</text>
  
  <text x="256" y="470" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="400" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.9"
        letter-spacing="4">PROFESSIONAL</text>
</svg>
