      <path d="M -5 75 L -2.5 112 L 0 117 L 2.5 112 L 5 75 Z" fill="#ffffff"/>
      
      <line x1="-7" y1="80" x2="-5" y2="110" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="0" y1="80" x2="0" y2="117" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="7" y1="80" x2="5" y2="110" stroke="#e0e0e0" stroke-width="1"/>
    </g>
    
    <path d="M 0 120 Q 38 125 56 105 Q 69 93 63 80" 
          stroke="url(#paint512)" 
          stroke-width="10" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9"/>
    
    <ellipse cx="60" cy="85" rx="4" ry="6" fill="#0e639c" opacity="0.85"/>
  </g>
  
  <g transform="translate(256, 256)" filter="url(#shadow512)">
