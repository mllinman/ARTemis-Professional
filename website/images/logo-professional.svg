<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gray gradient background matching reference -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8b2c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a95a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7580;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3D metallic text gradient - blue/teal -->
    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d5e0;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#6ba5bf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d7a95;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#4d8aa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5568;stop-opacity:1" />
    </linearGradient>
    
    <!-- Flowing paint gradient - blue to purple -->
    <linearGradient id="flowPaint1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#2d8fb8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="flowPaint2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b4c9a;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#8e6cc5;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#b88ce8;stop-opacity:0.85" />
    </linearGradient>
    
    <linearGradient id="flowPaint3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4db8e8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2d8fb8;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Deep shadow filter for 3D effect -->
    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="3" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect for paint -->
    <filter id="paintGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow for paint flows -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with gray gradient -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Flowing paint effects - upper left -->
  <g filter="url(#softShadow)">
    <path d="M 20 80 Q 40 60 70 55 Q 100 52 130 60 Q 150 65 160 80" 
          fill="url(#flowPaint1)" stroke="none" opacity="0.8"/>
    <path d="M 25 90 Q 50 70 85 68 Q 120 67 150 75" 
          fill="url(#flowPaint3)" stroke="none" opacity="0.7"/>
    <path d="M 30 100 Q 60 85 95 88 Q 125 90 145 100" 
          fill="url(#flowPaint1)" stroke="none" opacity="0.6"/>
  </g>
  
  <!-- Flowing paint effects - bottom right -->
  <g filter="url(#softShadow)">
    <path d="M 240 320 Q 270 310 300 315 Q 330 320 360 335 Q 380 345 385 360" 
          fill="url(#flowPaint2)" stroke="none" opacity="0.8"/>
    <path d="M 250 330 Q 280 323 310 328 Q 340 333 370 348" 
          fill="url(#flowPaint3)" stroke="none" opacity="0.7"/>
    <path d="M 260 340 Q 285 335 315 340 Q 345 345 375 358" 
          fill="url(#flowPaint1)" stroke="none" opacity="0.6"/>
  </g>
  
  <!-- Small paint orbs/spheres -->
  <circle cx="90" cy="350" r="12" fill="#6b4c9a" filter="url(#paintGlow)" opacity="0.7"/>
  <circle cx="90" cy="350" r="8" fill="#8e6cc5" opacity="0.5"/>
  
  <circle cx="320" cy="90" r="15" fill="#2d8fb8" filter="url(#paintGlow)" opacity="0.7"/>
  <circle cx="320" cy="90" r="10" fill="#4db8e8" opacity="0.5"/>
  
  <!-- Main "Artemis" text with 3D metallic effect -->
  <g filter="url(#deepShadow)">
    <!-- Text outline for depth -->
    <text x="200" y="220" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="95" 
          font-weight="bold"
          font-style="italic"
          fill="#1a2832" 
          text-anchor="middle"
          letter-spacing="-2">Artemis</text>
    
    <!-- Main metallic text -->
    <text x="200" y="216" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="95" 
          font-weight="bold"
          font-style="italic"
          fill="url(#textMetallic)" 
          text-anchor="middle"
          letter-spacing="-2">Artemis</text>
    
    <!-- Highlight on text -->
    <text x="200" y="213" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-size="95" 
          font-weight="bold"
          font-style="italic"
          fill="none"
          stroke="#d8eef5"
          stroke-width="0.8"
          text-anchor="middle"
          letter-spacing="-2"
          opacity="0.5">Artemis</text>
  </g>
  
  <!-- Purple/magenta dot accent on the "i" -->
  <circle cx="239" cy="165" r="8" fill="#6b4c9a" filter="url(#paintGlow)"/>
  <circle cx="239" cy="165" r="6" fill="#a86cd5" opacity="0.8"/>
  <circle cx="237" cy="163" r="3" fill="#d8a8ff" opacity="0.6"/>
  
  <!-- Subtitle -->
  <text x="200" y="265" 
        font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="400" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.95">DIGITAL PAINTING SOFTWARE</text>
  
  <!-- Additional flowing paint strokes -->
  <g filter="url(#softShadow)" opacity="0.5">
    <path d="M 50 200 Q 80 195 110 200" 
          stroke="url(#flowPaint1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 290 180 Q 320 175 350 180" 
          stroke="url(#flowPaint2)" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Particle effects -->
  <g opacity="0.4">
    <circle cx="130" cy="120" r="2" fill="#4db8e8"/>
    <circle cx="270" cy="250" r="2" fill="#a86cd5"/>
    <circle cx="70" cy="280" r="1.5" fill="#00d4ff"/>
    <circle cx="340" cy="140" r="1.5" fill="#6b4c9a"/>
  </g>
</svg>
