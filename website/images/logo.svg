<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8b2c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a95a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d5e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d7a95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d8fb8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:0.9" />
    </linearGradient>
    <filter id="textShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#logoBg)"/>
  
  <!-- Paint flows -->
  <path d="M 15 40 Q 25 35 40 38 Q 50 40 55 48" fill="url(#logoPaint)" opacity="0.7"/>
  <path d="M 145 150 Q 160 148 175 152 Q 185 155 190 165" fill="#6b4c9a" opacity="0.7"/>
  
  <!-- Paint orb -->
  <circle cx="170" cy="45" r="6" fill="#2d8fb8" opacity="0.7"/>
  <circle cx="170" cy="45" r="4" fill="#4db8e8" opacity="0.5"/>
  
  <!-- "Artemis" text with 3D effect -->
  <g filter="url(#textShadow)">
    <text x="100" y="110" 
          font-family="'Georgia', serif" 
          font-size="42" 
          font-weight="bold"
          font-style="italic"
          fill="url(#logoMetal)" 
          text-anchor="middle"
          letter-spacing="-1">Artemis</text>
  </g>
  
  <!-- Purple dot on i -->
  <circle cx="107" cy="81" r="4" fill="#6b4c9a"/>
  <circle cx="107" cy="81" r="3" fill="#a86cd5" opacity="0.7"/>
  
  <!-- Subtitle -->
  <text x="100" y="135" 
        font-family="Arial, sans-serif" 
        font-size="10" 
        font-weight="normal" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.95">DIGITAL PAINTING</text>
  
  <!-- Small particles -->
  <circle cx="50" cy="165" r="1" fill="#4db8e8" opacity="0.6"/>
  <circle cx="155" cy="70" r="1" fill="#a86cd5" opacity="0.6"/>
</svg>
