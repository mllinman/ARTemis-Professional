<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d30;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#252526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3728;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a2818;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1808;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e639c;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0e639c;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with dark slate -->
  <circle cx="100" cy="100" r="95" fill="url(#logoBg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0e639c" stroke-width="2" opacity="0.5"/>
  
  <!-- Professional paintbrush design -->
  <g transform="translate(100, 100)">
    <!-- Brush handle - tapered -->
    <path d="M -9 -60 L -6 20 L 6 20 L 9 -60 Z" fill="url(#logoWood)"/>
    
    <!-- Wood grain -->
    <line x1="-5" y1="-55" x2="-4" y2="15" stroke="#1a0f08" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-58" x2="0" y2="18" stroke="#1a0f08" stroke-width="0.5" opacity="0.4"/>
    <line x1="5" y1="-55" x2="4" y2="15" stroke="#1a0f08" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Handle bands -->
    <ellipse cx="0" cy="-45" rx="10" ry="1.5" fill="#2a1808" opacity="0.6"/>
    <ellipse cx="0" cy="-30" rx="9" ry="1.5" fill="#2a1808" opacity="0.6"/>
    <ellipse cx="0" cy="-15" rx="8" ry="1.5" fill="#2a1808" opacity="0.6"/>
    
    <!-- Ferrule - metallic -->
    <path d="M -7 20 L -5 28 L 5 28 L 7 20 Z" fill="#a0a0a0"/>
    <path d="M -6 21 L -5 27 L 5 27 L 6 21 Z" fill="none" stroke="#707070" stroke-width="0.3"/>
    <path d="M -5.5 21.5 L -4.5 26 L -3.5 26 L -4.5 21.5 Z" fill="#c0c0c0" opacity="0.6"/>
    
    <!-- Bristles - realistic -->
    <path d="M -5 28 Q -6 38 -3 44 Q -1 47 0 48 Q 1 47 3 44 Q 6 38 5 28 Z" fill="#e8e8e8" opacity="0.95"/>
    <path d="M -3 28 Q -4 39 -2 43 Q 0 45 0 46 Q 0 45 2 43 Q 4 39 3 28 Z" fill="#f0f0f0" opacity="0.9"/>
    <line x1="-3" y1="30" x2="-2.5" y2="42" stroke="#d0d0d0" stroke-width="0.3" opacity="0.6"/>
    <line x1="0" y1="29" x2="0" y2="46" stroke="#e0e0e0" stroke-width="0.4" opacity="0.7"/>
    <line x1="3" y1="30" x2="2.5" y2="42" stroke="#d0d0d0" stroke-width="0.3" opacity="0.6"/>
    
    <!-- Paint stroke -->
    <path d="M 0 45 Q 12 47 18 40" stroke="url(#logoPaint)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.95"/>
    <ellipse cx="17" cy="41" rx="1" ry="2" fill="#0e639c" opacity="0.85"/>
    
    <!-- Letter A -->
    <text x="-35" y="-30" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#cccccc">A</text>
    <circle cx="-20" cy="-38" r="1.5" fill="#00d4ff" opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#cccccc" text-anchor="middle">ARTemis</text>
</svg>
