<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1177bb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e639c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" stroke="#0a4a7a" stroke-width="2"/>
  
  <!-- Paintbrush design -->
  <g transform="translate(100, 100)">
    <!-- Brush handle -->
    <rect x="-8" y="-60" width="16" height="80" fill="#8b4513" rx="2"/>
    <rect x="-8" y="-60" width="16" height="20" fill="#a0522d" rx="2"/>
    
    <!-- Ferrule (metal part) -->
    <path d="M -10 20 L -6 30 L 6 30 L 10 20 Z" fill="#c0c0c0"/>
    
    <!-- Brush bristles -->
    <path d="M -6 30 Q -8 45 -4 50 Q 0 52 4 50 Q 8 45 6 30 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M -4 30 L -2 48 L 0 50 L 2 48 L 4 30 Z" fill="#f0f0f0"/>
    
    <!-- Letter A -->
    <text x="-35" y="-30" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">A</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">ARTemis</text>
</svg>
